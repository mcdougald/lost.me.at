<text x="728" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0a0a0a" opacity="0.8"><tspan x="728" dy="0">Misses are</tspan><tspan x="728" dy="19">logged to add</tspan><tspan x="728" dy="19">aliases.</tspan></text>

<text x="24" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="24" dy="0">The recovery copy is translated into all eight languages the network serves.</tspan></text>
